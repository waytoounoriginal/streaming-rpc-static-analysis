syntax = "proto3";

package buildbox_repro;

message Digest {
  string hash = 1;
  int64 size_bytes = 2;
}

message StageTreeRequest {
  string instance_name = 1;
  Digest root_digest = 2;
  string path = 3;
  repeated string pre_unstage_commands = 5;

  enum StagingMode {
    DEFAULT = 0;
    FUSE = 1;
    COPY_OR_LINK = 2;
  }
  StagingMode staging_mode = 6;
}

message StageTreeResponse {
  string path = 1;
}

service LocalContentAddressableStorage {
  rpc StageTree(stream StageTreeRequest) returns (stream StageTreeResponse) {}
}

message ReadRequest {
  string resource_name = 1;
  int64 read_offset = 2;
  int64 read_limit = 3;
}

message ReadResponse {
  bytes data = 10;
}

message WriteRequest {
  string resource_name = 1;
  int64 write_offset = 2;
  bool finish_write = 3;
  bytes data = 10;
}

message WriteResponse {
  int64 committed_size = 1;
}

service ByteStream {
  rpc Read(ReadRequest) returns (stream ReadResponse);
  rpc Write(stream WriteRequest) returns (WriteResponse);
}
